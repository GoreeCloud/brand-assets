<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">GoreeCloud Music abstract record artwork</title>
<desc id="desc">Midnight blue surfaces, illuminated vinyl grooves, and violet-to-aqua listening waves.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
