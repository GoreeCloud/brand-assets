<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">GoreeCloud Browser Mobile — Prism Tabs v4 transparent foreground study</title>
<desc id="desc">Transparent foreground study: a rounded browser pane, distinct selected and inactive curved tabs, and a clear address bar in the GoreeCloud Iris and Lagoon palette.</desc>
<defs>
  <linearGradient id="tile" x1="18" y1="14" x2="495" y2="503" gradientUnits="userSpaceOnUse">
    <stop stop-color="#233763"/><stop offset=".55" stop-color="#142444"/><stop offset="1" stop-color="#0B1830"/>
  </linearGradient>
  <linearGradient id="body" x1="118" y1="225" x2="397" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D1EBFF"/><stop offset=".43" stop-color="#A9D4F2"/><stop offset="1" stop-color="#6BABC9"/>
  </linearGradient>
  <linearGradient id="teal" x1="112" y1="157" x2="258" y2="244" gradientUnits="userSpaceOnUse">
    <stop stop-color="#C4FFF3"/><stop offset=".55" stop-color="#72E2D6"/><stop offset="1" stop-color="#40AEC9"/>
  </linearGradient>
  <linearGradient id="blue" x1="218" y1="171" x2="347" y2="233" gradientUnits="userSpaceOnUse">
    <stop stop-color="#AED6FF"/><stop offset=".55" stop-color="#78A6EF"/><stop offset="1" stop-color="#597EDB"/>
  </linearGradient>
  <linearGradient id="iris" x1="323" y1="186" x2="413" y2="227" gradientUnits="userSpaceOnUse">
    <stop stop-color="#C5B9FF"/><stop offset=".5" stop-color="#9B94F6"/><stop offset="1" stop-color="#6F78D9"/>
  </linearGradient>
  <radialGradient id="halo" cx=".52" cy=".55" r=".55">
    <stop stop-color="#DAFFFF" stop-opacity=".82"/><stop offset=".65" stop-color="#C3F1F7" stop-opacity=".38"/><stop offset="1" stop-color="#C3F1F7" stop-opacity="0"/>
  </radialGradient>
</defs>
<!-- True browser tab strip: low, horizontal caps sit on a common baseline. -->
<path d="M311 218L317 190C320 176 328 170 343 170H381C398 170 409 182 409 199V223H310Z" fill="url(#iris)"/>
<path d="M218 221L225 174C228 160 237 154 252 154H312C327 154 340 165 344 181L352 223Z" fill="url(#blue)"/>
<!-- Browsing canvas: bright, glass-like content panel, not a heavy suitcase case. -->
<rect x="95" y="217" width="323" height="186" rx="28" fill="url(#body)"/>
<rect x="100" y="222" width="313" height="176" rx="23" fill="none" stroke="#487B9E" stroke-opacity=".62" stroke-width="5"/>
<ellipse cx="252" cy="334" rx="135" ry="68" fill="url(#halo)" opacity=".72"/>
<!-- Active cap projects from the left but its base visibly joins the window. -->
<path d="M108 223L116 183C120 166 133 153 151 153H233C252 153 264 165 270 182L283 223Z" fill="url(#teal)"/>
<path d="M129 179C133 169 141 166 152 166H227" fill="none" stroke="#FFFFFF" stroke-opacity=".61" stroke-width="5" stroke-linecap="round"/>
<!-- Tab-rail seam is interrupted under the active tab, like a selected browser tab. -->
<path d="M283 228H402" fill="none" stroke="#6E9DBC" stroke-opacity=".56" stroke-width="5" stroke-linecap="round"/>
<!-- Functional omnibox element creates unmistakable browser chrome. -->
<rect x="134" y="252" width="245" height="39" rx="19.5" fill="#FFFFFF" fill-opacity=".90"/>
<circle cx="162" cy="271.5" r="7" fill="#5BA7B8"/>
<path d="M184 271.5H348" fill="none" stroke="#84B3CE" stroke-opacity=".81" stroke-width="6" stroke-linecap="round"/>
<!-- Content area stays quiet; the tab strip and omnibox carry the browser metaphor. -->
</svg>