<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">GoreeCloud Browser Mobile — Prism Tabs v3 monochrome line-icon study</title>
<desc id="desc">Three separate curved browser tab caps and a continuous page outline, rendered in one color without a filled notepad-like page.</desc>
