name: Validate official brand identity sources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned raster tooling
        run: npm ci
      - name: Verify canonical SVGs, raster files, and provenance
        run: npm test
